[workspace]
resolver = "3"
members = ["crates/zendo", "crates/zendo-core"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/leandrop-dev/zendo"

[workspace.dependencies]
anyhow = "1"
# The Steam sign-in token's dates (a JWT); already in the build.
base64 = "0.23.1"
# The window's words in each language (Mozilla's Fluent); unic-langid
# names the languages, sys-locale finds the system's (cosmic-text already
# brings it).
fluent-bundle = "0.16.0"
gilrs = "0.11.2"
# GTK 3, the version wry builds its Linux web view on.
gtk = "0.18"
iced = { version = "0.14.0", features = ["image"] }
keyvalues-parser = "0.2.4"
roxmltree = "0.20.0"
# The system keyring (Secret Service) for the API keys, on the async-io
# runtime zbus already runs on for Iced.
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.0"
shlex = "2.0.1"
sys-locale = "0.3.2"
unic-langid = "0.9"
x11rb = "0.13.2"
ureq = "3.5.1"
# The WebKit view under wry's, for the sign-in window's pop-ups; the
# version wry pins.
webkit2gtk = "=2.0.2"
# The sign-in window's web view, WebKitGTK; X11 support left out, as GTK
# needs none to embed it.
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
zendo-core = { path = "crates/zendo-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every exception says why, and is an `expect` that warns once unneeded.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
strip = true
lto = "thin"
