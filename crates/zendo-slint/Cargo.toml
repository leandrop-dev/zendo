[package]
name = "zendo-slint"
version = "0.1.0"
description = "Zendo's window, in Slint: the port from Iced, until it replaces the `zendo` binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
slint.workspace = true
zendo-core.workspace = true
zendo-shell.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# A window that needs no display, for the tests of what the Rust side sets.
i-slint-backend-testing = "1.18"

# The workspace's lints, with one difference: `unsafe_code` is denied here,
# not forbidden, because the code Slint generates from the `.slint` files
# carries `#[allow(unsafe_code)]`, which a `forbid` overrules. Nothing written
# by hand may use `unsafe`: it would need an `allow`, which `allow_attributes`
# flags.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
