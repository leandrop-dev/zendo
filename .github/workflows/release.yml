name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: git for the checkout
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
      - name: Build the package and the repository
        run: |
          pacman -S --noconfirm --needed base-devel rust curl \
            fontconfig gtk3 hicolor-icon-theme libglvnd libsoup3 \
            libx11 libxcursor libxi libxkbcommon libxkbcommon-x11 \
            wayland webkit2gtk-4.1
          useradd -m builder
          tag="${GITHUB_REF_NAME#v}"
          version=$(printf '%s' "$tag" | tr '-' '_')
          pkg=/tmp/zendo-pkg
          cp -r packaging/arch/zendo "$pkg"
          sed -i "s/^pkgver=.*/pkgver=$version/" "$pkg/PKGBUILD"
          sed -i "s/^_tag=.*/_tag=$tag/" "$pkg/PKGBUILD"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o "/tmp/zendo-$version.tar.gz"
          sha=$(sha256sum "/tmp/zendo-$version.tar.gz" | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('$sha')/" "$pkg/PKGBUILD"
          chown -R builder "$pkg"
          su builder -c "cd $pkg && makepkg -f --nocheck --nodeps"
          mkdir -p repo/x86_64
          cp "$pkg"/*.pkg.tar.zst repo/x86_64/
          cd repo/x86_64
          repo-add zendo.db.tar.gz ./*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: repo/x86_64/*.pkg.tar.zst
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          keep_files: true

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: git for the checkout
        run: dnf install -y git tar gzip
      - uses: actions/checkout@v4
      - name: Make the SRPM
        run: |
          dnf install -y rpm-build rpmdevtools cargo rust git tar xz curl python3-pip
          version="${GITHUB_REF_NAME#v}"
          sh packaging/fedora/make-srpm.sh "$version" /tmp/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: /tmp/dist/*.src.rpm
      - name: Build it on COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          pip install --quiet copr-cli
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' \
            "$COPR_LOGIN" "$COPR_LOGIN" "$COPR_API_TOKEN" >/tmp/copr.conf
          chmod 600 /tmp/copr.conf
          copr-cli --config /tmp/copr.conf build leandrop/zendo /tmp/dist/*.src.rpm

  release:
    needs: [arch, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Source tarball and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="zendo-$version/" -o "dist/zendo-$version.tar.gz" "$GITHUB_REF_NAME"
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zendo ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          body: |
            Arch: add the repository once and update with pacman.

                [zendo]
                SigLevel = Optional TrustAll
                Server = https://leandrop-dev.github.io/zendo/$arch

            Fedora: `dnf copr enable leandrop/zendo && dnf install zendo`.

            The notes for this release are in `docs/history.md`; the checksums
            cover the source tarball and both packages.
          files: dist/*
